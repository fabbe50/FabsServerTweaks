plugins {
    id "com.gradleup.shadow" version "9.2.2"
}

var accessWidener = file("src/main/resources/${mod_id}.accesswidener")

loom {
    accessWidenerPath = file(accessWidener)
}

configurations {
    shadowCommon
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    api "dev.architectury:architectury:${architectury_api_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    implementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

//    compileOnly "dev.emi:emi-xplat-intermediary:${emi_version}:api"
    compileOnlyApi "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
//    compileOnly "me.shedaniel:RoughlyEnoughItems-api:${rei_version}"
//    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin:${rei_version}"
}

architectury {
    common rootProject.enabled_platforms.split(',')
}

jar {
    archiveClassifier = "raw"
}

java {
    withSourcesJar()
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
