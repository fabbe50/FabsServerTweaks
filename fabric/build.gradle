plugins {
    id 'com.github.johnrengelman.shadow'
}

def generatedResources = project(":common").file("src/main/generated/resources")
def commonBuiltinResourcePacks = project(":common").file("src/main/resources/resourcepacks")
def accessWidener = project(":common").file("src/main/resources/${mod_id}.accesswidener")

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

loom {
    accessWidenerPath.set(accessWidener)

    runs {
        client {
            programArgs("--username", "Dev")
        }
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    modImplementation "com.terraformersmc:modmenu:${mod_menu_version}" transitive false
    modImplementation "me.shedaniel.cloth:cloth-config:${cloth_config_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}" transitive false

    //modLocalRuntime "dev.emi:emi-fabric:${emi_version}"
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}"
    //modImplementation "vazkii.patchouli:Patchouli:${patchouli_version_fabric}"
    //modImplementation "dev.emi:trinkets:${trinkets_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    from(commonBuiltinResourcePacks) {
        into("resourcepacks")
    }

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }

    from(accessWidener) {
        into("")
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
